<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Kawaii British Mart - Mega Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #FFF8E7;
            --uk-red: #E63946;
            --uk-blue: #1D3557;
            --accent-yellow: #FFB703;
            --mint-green: #2A9D8F;
            --purple-role: #7209B7;
            --shelf-wood: #D4A373;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            position: fixed;
            inset: 0;
            overflow: hidden;
            font-family: 'M PLUS Rounded 1c', 'Fredoka', sans-serif;
            background-color: var(--bg-cream);
            background-image: radial-gradient(#FAD2E1 2px, transparent 2px), radial-gradient(#BEE1E6 2px, var(--bg-cream) 2px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
        }

        /* --- EKRAN STARTOWY --- */
        #start-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1D3557 0%, #457B9D 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 10px;
        }

        .title-badge {
            background: var(--uk-red);
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 800;
            border: 2px solid white;
            margin-bottom: 4px;
        }

        #start-screen h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.2rem;
            margin: 4px 0;
            text-shadow: 2px 2px 0px var(--uk-red);
        }

        .setup-section {
            background: rgba(255, 255, 255, 0.12);
            padding: 6px 12px;
            border-radius: 12px;
            margin: 4px 0;
            border: 2px dashed rgba(255,255,255,0.4);
            max-width: 580px;
            width: 100%;
        }

        .setup-title {
            font-size: 0.85rem;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--accent-yellow);
        }

        .options-row {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .opt-btn {
            background: white;
            color: var(--uk-blue);
            border: 2px solid #CBD5E1;
            padding: 5px 10px;
            border-radius: 10px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .opt-btn.active {
            background: var(--accent-yellow);
            color: #78350F;
            border-color: white;
            box-shadow: 0 3px 0 #D97706;
        }

        .big-start-btn {
            background: var(--mint-green);
            color: white;
            border: 3px solid white;
            padding: 8px 28px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 0 #1B635A;
        }

        /* --- GÓRNY PASEK --- */
        header {
            background: var(--uk-blue);
            color: white;
            padding: 4px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 42px;
            flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .header-info {
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 800;
        }

        .scores-container {
            display: flex;
            gap: 6px;
        }

        .score-pill {
            background: var(--uk-red);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.8rem;
            border: 2px solid white;
        }
        .score-pill.p2 { background: var(--mint-green); }

        .btn-home {
            background: #EF4444;
            color: white;
            border: none;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* --- GŁÓWNA GRA --- */
        main {
            display: grid;
            grid-template-columns: 1.45fr 1fr;
            gap: 8px;
            padding: 6px 8px 8px 8px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .shelves-container {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 14px;
            padding: 6px;
            border: 3px solid var(--shelf-wood);
            display: flex;
            flex-direction: column;
            min-height: 0;
            height: 100%;
            overflow: hidden;
        }

        .category-tabs {
            display: flex;
            gap: 3px;
            margin-bottom: 5px;
            flex-shrink: 0;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 4px 2px;
            border-radius: 6px;
            border: 2px solid var(--uk-blue);
            background: white;
            font-weight: 800;
            font-size: 0.7rem;
            cursor: pointer;
            color: var(--uk-blue);
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--uk-blue);
            color: white;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex: 1;
            min-height: 0;
            padding-right: 2px;
            align-content: start;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            border: 2px solid #E2E8F0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 2px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 2px 0 #E2E8F0;
            min-height: 70px;
        }

        .product-card:active {
            transform: scale(0.95);
            border-color: var(--accent-yellow);
        }

        .product-emoji { font-size: 1.5rem; line-height: 1; margin-bottom: 2px; }
        .product-name-en {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--uk-blue);
            text-align: center;
            line-height: 1.05;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .product-price {
            background: var(--mint-green);
            color: white;
            padding: 1px 4px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.62rem;
            margin-top: 2px;
        }
        .sound-icon { position: absolute; top: 2px; right: 3px; font-size: 0.55rem; opacity: 0.5; }

        .counter-area {
            display: flex;
            flex-direction: column;
            gap: 6px;
            height: 100%;
            min-height: 0;
            overflow: hidden;
        }

        .turn-banner {
            background: var(--purple-role);
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid white;
            flex-shrink: 0;
        }

        .turn-banner.buyer-turn { background: #E63946; }
        .turn-banner.seller-turn { background: #2A9D8F; }

        .shopkeeper-box {
            background: white;
            border-radius: 12px;
            padding: 6px 8px;
            border: 3px solid var(--uk-blue);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: #FFE5EC;
            border-radius: 50%;
            border: 2px solid var(--uk-red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            flex-shrink: 0;
        }

        .speech-bubble { flex: 1; min-width: 0; }
        .speech-en {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
            color: var(--uk-blue);
            font-weight: 700;
            margin: 0 0 2px 0;
            line-height: 1.15;
        }
        .speech-jp-hint {
            font-size: 0.68rem;
            color: #475569;
            margin: 0 0 3px 0;
            font-weight: 700;
        }

        .listen-btn {
            background: #E0F2FE;
            color: #0369A1;
            border: 2px solid #0369A1;
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.68rem;
            cursor: pointer;
        }

        .basket-box {
            background: white;
            border-radius: 12px;
            padding: 6px 8px;
            border: 3px solid var(--uk-blue);
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .basket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            color: var(--uk-blue);
            border-bottom: 2px dashed #CBD5E1;
            padding-bottom: 3px;
            flex-shrink: 0;
            font-size: 0.8rem;
        }

        .basket-items {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 4px 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex: 1;
            min-height: 0;
            align-content: start;
        }

        .basket-chip {
            background: #FEF3C7;
            border: 2px solid var(--accent-yellow);
            padding: 2px 6px;
            border-radius: 8px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .basket-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            padding-top: 3px;
        }

        .btn-clear {
            background: #F1F5F9;
            color: #475569;
            border: 2px solid #CBD5E1;
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-main-action {
            flex: 1;
            background: var(--mint-green);
            color: white;
            border: none;
            padding: 7px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 3px 0 #1E7167;
        }

        /* --- MODAL PŁATNOŚCI --- */
        #payment-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(29, 53, 87, 0.88);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }

        .payment-card {
            background: var(--bg-cream);
            width: 100%;
            max-width: 680px;
            border-radius: 16px;
            border: 4px solid var(--accent-yellow);
            padding: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-height: 94dvh;
            overflow-y: auto;
        }

        .modal-role-header {
            text-align: center;
            background: var(--uk-blue);
            color: white;
            padding: 4px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .payment-top {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: white;
            padding: 5px 10px;
            border-radius: 10px;
            margin-bottom: 5px;
            border: 2px solid var(--uk-blue);
        }

        .money-display { text-align: center; }
        .money-label { font-size: 0.68rem; font-weight: 800; color: #64748B; }
        .money-value { font-family: 'Fredoka', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--uk-red); }
        .money-value.paid { color: var(--mint-green); }

        .wallet-section-title { font-weight: 800; color: var(--uk-blue); margin: 3px 0; font-size: 0.75rem; }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 5px;
        }

        .banknote {
            height: 34px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.6);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }
        .banknote:active { transform: scale(0.95); }
        .note-5 { background: linear-gradient(135deg, #2A9D8F, #21867A); }
        .note-10 { background: linear-gradient(135deg, #E76F51, #D65A3C); }
        .note-20 { background: linear-gradient(135deg, #7209B7, #560BAD); }
        .note-50 { background: linear-gradient(135deg, #D62828, #B21E1E); }

        .coins-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            margin-bottom: 6px;
        }

        .coin {
            aspect-ratio: 1;
            max-height: 40px;
            margin: 0 auto;
            width: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            box-shadow: 0 2px 0 rgba(0,0,0,0.25);
            border: 2px solid rgba(255,255,255,0.5);
        }
        .coin:active { transform: scale(0.92); }
        .coin-copper { background: #B87333; color: white; }
        .coin-silver { background: #CBD5E1; color: #1E293B; }
        .coin-gold { background: #FBBF24; color: #78350F; }

        .payment-footer { display: flex; gap: 8px; }
        .btn-pay-confirm {
            flex: 2;
            background: var(--uk-red);
            color: white;
            border: none;
            padding: 7px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 3px 0 #9B2226;
        }
        .btn-pay-reset {
            flex: 1;
            background: #64748B;
            color: white;
            border: none;
            padding: 7px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
        }

        #toast {
            position: fixed;
            top: 48px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--uk-blue);
            color: white;
            padding: 6px 18px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            border: 2px solid var(--accent-yellow);
            z-index: 200;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- EKRAN STARTOWY -->
    <div id="start-screen">
        <div class="title-badge">🇬🇧 イギリスのスーパーマーケット 🇯🇵</div>
        <h1>Kawaii British Mart</h1>
        <p style="font-size: 0.9rem; margin: 0 0 5px 0;">モードと難易度をえらんでスタート！</p>

        <div class="setup-section">
            <div class="setup-title">👥 ゲームモード</div>
            <div class="options-row">
                <button class="opt-btn active" id="mode-btn-1p" onclick="selectConfigMode('1p')">👤 1人 (交代)</button>
                <button class="opt-btn" id="mode-btn-2p" onclick="selectConfigMode('2p')">👫 2人 (対戦)</button>
                <button class="opt-btn" id="mode-btn-learn" onclick="selectConfigMode('learn')">🔊 単語練習</button>
            </div>
        </div>

        <div class="setup-section">
            <div class="setup-title">⭐ むずかしさ</div>
            <div class="options-row">
                <button class="opt-btn active" id="diff-btn-easy" onclick="selectConfigDiff('easy')">Easy (~15品)</button>
                <button class="opt-btn" id="diff-btn-med" onclick="selectConfigDiff('med')">Medium (~30品)</button>
                <button class="opt-btn" id="diff-btn-hard" onclick="selectConfigDiff('hard')">Hard (全~50品)</button>
            </div>
        </div>

        <button class="big-start-btn" onclick="launchGame()">🚀 ゲームスタート！</button>
    </div>

    <!-- POWIADOMIENIE TOAST -->
    <div id="toast"></div>

    <!-- GÓRNY PASEK -->
    <header>
        <div class="header-info">
            <button class="btn-home" onclick="returnToMenu()">🏠 メニュー</button>
            <span id="diff-badge-display">⭐ Easy</span>
        </div>
        <div class="scores-container">
            <div class="score-pill" id="score-box-1">⭐ P1: <span id="score1">0</span></div>
            <div class="score-pill p2" id="score-box-2" style="display: none;">🏪 P2: <span id="score2">0</span></div>
        </div>
    </header>

    <!-- GŁÓWNA GRA -->
    <main>
        <!-- PÓŁKI -->
        <section class="shelves-container">
            <div class="category-tabs">
                <button class="tab-btn active" onclick="filterCategory('all', this)">すべて</button>
                <button class="tab-btn" onclick="filterCategory('food', this)">🍎 食品</button>
                <button class="tab-btn" onclick="filterCategory('drinks', this)">🧃 飲み物</button>
                <button class="tab-btn" onclick="filterCategory('bakery', this)">🥐 パン</button>
                <button class="tab-btn" onclick="filterCategory('dessert', this)">🍰 デザート</button>
                <button class="tab-btn" onclick="filterCategory('fastfood', this)">🍔 バーガー・軽食</button>
            </div>
            <div class="products-grid" id="products-grid"></div>
        </section>

        <!-- LADA I DIALOG -->
        <section class="counter-area">
            <div class="turn-banner" id="turn-banner">
                <span id="turn-role-text">🛒 おきゃくさんのばん</span>
                <span id="round-info">Round 1</span>
            </div>

            <div class="shopkeeper-box">
                <div class="avatar" id="keeper-avatar">👩‍💼</div>
                <div class="speech-bubble">
                    <p class="speech-en" id="keeper-text-en">"Hello!"</p>
                    <p class="speech-jp-hint" id="keeper-text-jp">音声を聞いて英語を学ぼう！</p>
                    <button class="listen-btn" onclick="repeatSpeech()">🔊 もういちど</button>
                </div>
            </div>

            <div class="basket-box">
                <div class="basket-header">
                    <span id="basket-title">🧺 かいものかご</span>
                    <span id="basket-total-wrapper">ごうけい: <strong id="basket-total-display" style="color: var(--uk-red); font-size: 0.9rem;">£0.00</strong></span>
                </div>

                <div class="basket-items" id="basket-items"></div>

                <div class="basket-actions">
                    <button class="btn-clear" onclick="clearBasket()">🗑️ けす</button>
                    <button class="btn-main-action" id="main-action-btn" onclick="handleMainAction()">次へ</button>
                </div>
            </div>
        </section>
    </main>

    <!-- MODAL PŁATNOŚCI -->
    <div id="payment-modal">
        <div class="payment-card">
            <div class="modal-role-header" id="modal-role-title">🛒 お金をはらおう！</div>

            <div class="payment-top">
                <div class="money-display">
                    <div class="money-label" id="pay-label-1">おかいけい</div>
                    <div class="money-value" id="pay-val-1">£0.00</div>
                </div>
                <div style="font-size: 1.3rem;">➡️</div>
                <div class="money-display">
                    <div class="money-label" id="pay-label-2">だしたおかね</div>
                    <div class="money-value paid" id="pay-val-2">£0.00</div>
                </div>
                <button class="listen-btn" onclick="speakModalPrompt()">🔊 きく</button>
            </div>

            <div class="wallet-section-title">💵 おさつ (Pounds)</div>
            <div class="notes-grid">
                <div class="banknote note-5" onclick="addMoney(500)">£5</div>
                <div class="banknote note-10" onclick="addMoney(1000)">£10</div>
                <div class="banknote note-20" onclick="addMoney(2000)">£20</div>
                <div class="banknote note-50" onclick="addMoney(5000)">£50</div>
            </div>

            <div class="wallet-section-title">🪙 コイン (Pence & Pounds)</div>
            <div class="coins-grid">
                <div class="coin coin-copper" onclick="addMoney(1)">1p</div>
                <div class="coin coin-copper" onclick="addMoney(2)">2p</div>
                <div class="coin coin-silver" onclick="addMoney(5)">5p</div>
                <div class="coin coin-silver" onclick="addMoney(10)">10p</div>
                <div class="coin coin-silver" onclick="addMoney(20)">20p</div>
                <div class="coin coin-silver" onclick="addMoney(50)">50p</div>
                <div class="coin coin-gold" onclick="addMoney(100)">£1</div>
                <div class="coin coin-gold" onclick="addMoney(200)">£2</div>
            </div>

            <div class="payment-footer">
                <button class="btn-pay-reset" onclick="resetPayment()">やりなおす</button>
                <button class="btn-pay-confirm" id="modal-confirm-btn" onclick="confirmMoneyAction()">✨ はらう</button>
            </div>
        </div>
    </div>

    <script>
        // OGROMNA BAZA PONAD 45 PRODUKTÓW
        const allProducts = [
            // EASY (~15 items)
            { id: 'apple', name: 'Apple', price: 50, emoji: '🍎', cat: 'food', tier: 'easy' },
            { id: 'banana', name: 'Banana', price: 40, emoji: '🍌', cat: 'food', tier: 'easy' },
            { id: 'milk', name: 'Milk', price: 120, emoji: '🥛', cat: 'drinks', tier: 'easy' },
            { id: 'water', name: 'Water', price: 85, emoji: '💧', cat: 'drinks', tier: 'easy' },
            { id: 'orange_juice', name: 'Orange juice', price: 150, emoji: '🧃', cat: 'drinks', tier: 'easy' },
            { id: 'tea', name: 'English tea', price: 250, emoji: '🫖', cat: 'drinks', tier: 'easy' },

        let activeProducts = [];
        let selectedMode = '1p';
        let selectedDiff = 'easy';

        function selectConfigMode(m) {
            selectedMode = m;
            document.querySelectorAll('.setup-section .options-row button').forEach((b, i) => {

            });

        function selectConfigDiff(d) {

            ['easy', 'med', 'hard'].forEach(diff => {

            document.getElementById(`diff-btn-${d}`).classList.add('active');

        function returnToMenu() {
            document.getElementById('start-screen').style.display = 'flex';
        }

        const buyerPhrases1 = [
            (i) => `Hello! Can I have one ${i}, please?`,
            (i) => `Hi there! I'd like to buy one ${i}, please.`,
            (i) => `Good morning! Could you give me one ${i}?`,
            (i) => `Excuse me, I am looking for a ${i}.`
        ];

        const buyerPhrases2 = [
            (i1, i2) => `Hello! Can I have a ${i1} and a ${i2}, please?`,
            (i1, i2) => `Hi! I would like one ${i1} and one ${i2}.`,
            (i1, i2) => `Good day! Could I please get a ${i1} along with a ${i2}?`,
            (i1, i2) => `Hello! I need a ${i1} and a ${i2}, please.`
        ];

        const buyerPhrases3 = [
            (i1, i2, i3) => `Hello! Can I have a ${i1}, a ${i2} and a ${i3}, please?`,
            (i1, i2, i3) => `Hi! I'd like to get a ${i1}, a ${i2}, and a ${i3}.`,
            (i1, i2, i3) => `Good day! Please give me a ${i1}, a ${i2}, and a ${i3}.`
        ];

        const buyerPhrases4 = [
            (i1, i2, i3, i4) => `Hello! I need a ${i1}, a ${i2}, a ${i3}, and a ${i4}, please.`,
            (i1, i2, i3, i4) => `Hi! Can you get me a ${i1}, a ${i2}, a ${i3}, and a ${i4}?`
        ];

        let roundNumber = 1;
        let turnPhase = '1p_buyer';
        let paymentPhase = 'buyer_pays';
        let basket = [];
        let targetOrder = [];
        let lastSpokenText = "";
        let lastModalSpokenText = "";
        let targetBillPence = 0;
        let buyerPaidPence = 0;
        let expectedChangePence = 0;
        let currentInputMoney = 0;
        let score1 = 0;
        let score2 = 0;
        let englishVoice = null;

        function loadEnglishVoice() {
            const voices = window.speechSynthesis.getVoices();
            englishVoice = voices.find(v => v.lang === 'en-GB') ||
                           voices.find(v => v.lang.startsWith('en-GB')) ||
                           voices.find(v => v.lang === 'en-US') ||
                           voices.find(v => v.lang.startsWith('en'));
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadEnglishVoice;
            loadEnglishVoice();
        }

        function speakEnglish(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-GB';
            if (englishVoice) u.voice = englishVoice;
            u.rate = 0.88;
            window.speechSynthesis.speak(u);
        }

        function formatGBP(pence) {
            if (pence < 100) return `${pence}p`;
            return `£${(pence / 100).toFixed(2)}`;
        }

        function priceToEnglishSpeech(pence) {
            if (pence === 0) return "zero pence";
            const pounds = Math.floor(pence / 100);
            const remPence = pence % 100;
            if (pounds === 0) return `${remPence} pence`;
            if (remPence === 0) return pounds === 1 ? "one pound" : `${pounds} pounds`;
            return `${pounds === 1 ? "one pound" : `${pounds} pounds`} ${remPence}`;
        }

        function launchGame() {
            document.getElementById('start-screen').style.display = 'none';
            loadEnglishVoice();

            if (selectedDiff === 'easy') {
                activeProducts = allProducts.filter(p => p.tier === 'easy');
            } else if (selectedDiff === 'med') {
                activeProducts = allProducts.filter(p => p.tier === 'easy' || p.tier === 'med');
            } else {
                activeProducts = [...allProducts];
            }

            renderProducts('all');

            roundNumber = 1;
            score1 = 0;
            score2 = 0;
            updateScoreDisplay();

            const diffNames = { easy: '⭐ Easy', med: '⭐⭐ Medium', hard: '⭐⭐⭐ Hard' };
            document.getElementById('diff-badge-display').textContent = diffNames[selectedDiff];

            const sBox1 = document.getElementById('score-box-1');
            const sBox2 = document.getElementById('score-box-2');

            if (selectedMode === '2p') {
                sBox1.innerHTML = `🛒 P1: <span id="score1">0</span>`;
                sBox2.style.display = 'block';
                sBox2.innerHTML = `🏪 P2: <span id="score2">0</span>`;
            } else {
                sBox1.innerHTML = `⭐ ポイント: <span id="score1">0</span>`;
                sBox2.style.display = 'none';
            }

            setupNextRound();
        }

        function updateScoreDisplay() {
            const s1 = document.getElementById('score1');
            const s2 = document.getElementById('score2');
            if (s1) s1.textContent = score1;
            if (s2) s2.textContent = score2;
        }

        function getRequiredCount() {
            if (selectedDiff === 'easy') return 1;
            if (selectedDiff === 'med') return 2;
            return Math.random() > 0.5 ? 3 : 4;
        }

        function generateRandomOrder() {
            const count = getRequiredCount();
            const shuffled = [...activeProducts].sort(() => 0.5 - Math.random());
            targetOrder = shuffled.slice(0, count);

            const names = targetOrder.map(i => i.name);
            let phrase = "";

            if (count === 1) {
                const t = buyerPhrases1[Math.floor(Math.random() * buyerPhrases1.length)];
                phrase = t(names[0]);
            } else if (count === 2) {
                const t = buyerPhrases2[Math.floor(Math.random() * buyerPhrases2.length)];
                phrase = t(names[0], names[1]);
            } else if (count === 3) {
                const t = buyerPhrases3[Math.floor(Math.random() * buyerPhrases3.length)];
                phrase = t(names[0], names[1], names[2]);
            } else {
                const t = buyerPhrases4[Math.floor(Math.random() * buyerPhrases4.length)];
                phrase = t(names[0], names[1], names[2], names[3]);
            }

            lastSpokenText = phrase;
        }

        function setupNextRound() {
            basket = [];
            updateBasketUI();
            document.getElementById('round-info').textContent = `Round ${roundNumber}`;
            const banner = document.getElementById('turn-banner');
            const roleText = document.getElementById('turn-role-text');
            const mainBtn = document.getElementById('main-action-btn');

            if (selectedMode === 'learn') {
                turnPhase = 'learn';
                banner.className = 'turn-banner';
                roleText.textContent = '🔊 単語練習';
                document.getElementById('keeper-avatar').textContent = '👩‍🏫';
                lastSpokenText = "Touch any item to hear its English name!";
                document.getElementById('keeper-text-en').textContent = `"${lastSpokenText}"`;
                document.getElementById('keeper-text-jp').textContent = "すきな商品をタッチしよう！";
                mainBtn.textContent = "🗑️ かごを空にする";
                speakEnglish(lastSpokenText);
                return;
            }

            if (selectedMode === '1p') {
                if (roundNumber % 2 === 1) {
                    turnPhase = '1p_buyer';
                    banner.className = 'turn-banner buyer-turn';
                    roleText.textContent = '🛒 あなたの役: おきゃくさん';
                    document.getElementById('keeper-avatar').textContent = '👩‍💼';
                    generateRandomOrder();
                    document.getElementById('keeper-text-en').textContent = `"${lastSpokenText}"`;
                    document.getElementById('keeper-text-jp').textContent = "商品をえらんでレジへ進もう！";
                    mainBtn.textContent = "💷 おかいけいへ";
                    setTimeout(() => speakEnglish(lastSpokenText), 300);
                } else {
                    turnPhase = '1p_seller_pick';
                    banner.className = 'turn-banner seller-turn';
                    roleText.textContent = '🛒 あなたの役: てんいんさん';
                    document.getElementById('keeper-avatar').textContent = '🧒';
                    generateRandomOrder();
                    document.getElementById('keeper-text-en').textContent = `"${lastSpokenText}"`;
                    document.getElementById('keeper-text-jp').textContent = "音声を聞いて正しい商品をかごに入れよう！";
                    mainBtn.textContent = "📦 商品をわたす";
                    setTimeout(() => speakEnglish(lastSpokenText), 300);
                }
            }

            if (selectedMode === '2p') {
                turnPhase = '2p_buyer_pick';
                banner.className = 'turn-banner buyer-turn';
                const limit = selectedDiff === 'easy' ? 1 : (selectedDiff === 'med' ? 2 : 4);
                roleText.textContent = `🛒 P1 (おきゃく): ${limit}こまで商品を選ぼう！`;
                document.getElementById('keeper-avatar').textContent = '🙋‍♂️';
                lastSpokenText = "What would you like to buy today?";
                document.getElementById('keeper-text-en').textContent = `"${lastSpokenText}"`;
                document.getElementById('keeper-text-jp').textContent = "P1は商品をかごに入れて注文しよう！";
                mainBtn.textContent = "🗣️ ちゅうもんする";
                setTimeout(() => speakEnglish(lastSpokenText), 300);
            }
        }

        function renderProducts(category) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            const filtered = category === 'all' ? activeProducts : activeProducts.filter(p => p.cat === category);

            filtered.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <span class="sound-icon">🔊</span>
                    <div class="product-emoji">${prod.emoji}</div>
                    <div class="product-name-en">${prod.name}</div>
                    <div class="product-price">${formatGBP(prod.price)}</div>
                `;
                card.onclick = () => handleProductClick(prod);
                grid.appendChild(card);
            });
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(cat);
        }

        function handleProductClick(prod) {
            speakEnglish(prod.name);

            if (selectedMode === 'learn') {
                showToast(`🔊 "${prod.name}" (${formatGBP(prod.price)})`);
                return;
            }

            const limit = selectedDiff === 'easy' ? 1 : (selectedDiff === 'med' ? 2 : 4);
            if (turnPhase === '2p_buyer_pick' && basket.length >= limit) {
                showToast(`⚠️ 最大${limit}こまでです！`);
                return;
            }

            basket.push(prod);
            updateBasketUI();
        }

        function updateBasketUI() {
            const container = document.getElementById('basket-items');
            const totalDisplay = document.getElementById('basket-total-display');

            if (basket.length === 0) {
                container.innerHTML = '<span style="color: #94A3B8; font-size: 0.78rem;">商品をタッチしてね！</span>';
                totalDisplay.textContent = '£0.00';
                return;
            }

            container.innerHTML = '';
            let total = 0;
            basket.forEach((item, idx) => {
                total += item.price;
                const chip = document.createElement('div');
                chip.className = 'basket-chip';
                chip.innerHTML = `${item.emoji} ${item.name} ✕`;
                chip.onclick = () => {
                    basket.splice(idx, 1);
                    updateBasketUI();
                };
                container.appendChild(chip);
            });
            totalDisplay.textContent = formatGBP(total);
        }

        function clearBasket() {
            basket = [];
            updateBasketUI();
        }

        function repeatSpeech() {
            if (lastSpokenText) speakEnglish(lastSpokenText);
        }

        function handleMainAction() {
            if (selectedMode === 'learn') {
                clearBasket();
                return;
            }

            if (basket.length === 0) {
                showToast("⚠️ 商品を選んでね！");
                return;
            }

            if (turnPhase === '2p_buyer_pick') {
                targetOrder = [...basket];
                basket = [];
                updateBasketUI();

                turnPhase = '2p_seller_pick';
                const banner = document.getElementById('turn-banner');
                banner.className = 'turn-banner seller-turn';
                document.getElementById('turn-role-text').textContent = '🏪 P2 (てんいん): 正しい商品をえらぼう！';
                document.getElementById('keeper-avatar').textContent = '👩‍💼';

                const names = targetOrder.map(i => i.name);
                if (targetOrder.length === 1) lastSpokenText = `Can I have one ${names[0]}, please?`;
                else if (targetOrder.length === 2) lastSpokenText = `I would like a ${names[0]} and a ${names[1]}, please.`;
                else if (targetOrder.length === 3) lastSpokenText = `I need a ${names[0]}, a ${names[1]}, and a ${names[2]}, please.`;
                else lastSpokenText = `Can I get a ${names[0]}, a ${names[1]}, a ${names[2]}, and a ${names[3]}, please?`;

                document.getElementById('keeper-text-en').textContent = `"🎧 Listen to P1's order!"`;
                document.getElementById('keeper-text-jp').textContent = "英語を聞き取って同じ商品をかごに入れよう！";
                document.getElementById('main-action-btn').textContent = "📦 商品をわたす";

                speakEnglish(lastSpokenText);
                return;
            }

            const orderedIds = targetOrder.map(i => i.id).sort();
            const basketIds = basket.map(i => i.id).sort();
            const isMatch = orderedIds.length === basketIds.length &&
                            orderedIds.every((val, idx) => val === basketIds[idx]);

            targetBillPence = targetOrder.reduce((sum, item) => sum + item.price, 0);

            if (!isMatch) {
                speakEnglish("Oh no! Wrong items! No points.");
                showToast("❌ 商品がちがいます！ポイントなし");
                setTimeout(() => { roundNumber++; setupNextRound(); }, 2800);
                return;
            }

            if (turnPhase === '1p_buyer') {
                openPaymentModal('buyer_pays');
            } 
            else if (turnPhase === '1p_seller_pick') {
                score1 += 5;
                updateScoreDisplay();
                showToast("✅ 商品せいかい (+5pt)！おつりを計算しよう！");

                // SZERSZY WYBÓR WARIANTÓW WPŁACANYCH PIENIĘDZY (LOSOWY BANKNOT LUB MONETA)
                const possibleNotes = [500, 1000, 2000, 5000];
                const validNotes = possibleNotes.filter(n => n >= targetBillPence);
                buyerPaidPence = validNotes[Math.floor(Math.random() * validNotes.length)] || 5000;
                expectedChangePence = buyerPaidPence - targetBillPence;

                setTimeout(() => openPaymentModal('seller_gives_change'), 1400);
            } 
            else if (turnPhase === '2p_seller_pick') {
                score2 += 5;
                updateScoreDisplay();
                showToast("✅ P2 商品せいかい (+5pt)！");
                setTimeout(() => openPaymentModal('buyer_pays'), 1300);
            }
        }

        function openPaymentModal(phase) {
            paymentPhase = phase;
            currentInputMoney = 0;
            document.getElementById('payment-modal').style.display = 'flex';

            const roleTitle = document.getElementById('modal-role-title');
            const lbl1 = document.getElementById('pay-label-1');
            const val1 = document.getElementById('pay-val-1');
            const lbl2 = document.getElementById('pay-label-2');
            const val2 = document.getElementById('pay-val-2');
            const confirmBtn = document.getElementById('modal-confirm-btn');

            if (phase === 'buyer_pays') {
                roleTitle.textContent = selectedMode === '2p' ? "🛒 P1 (おきゃく)：お金をはらおう！" : "🛒 お金をはらおう！";
                roleTitle.style.background = "#E63946";
                lbl1.textContent = "おかいけい";
                val1.textContent = formatGBP(targetBillPence);
                lbl2.textContent = "だしたおかね";
                val2.textContent = "£0.00";
                confirmBtn.textContent = "✨ はらう";

                lastModalSpokenText = `That will be ${priceToEnglishSpeech(targetBillPence)}, please.`;
                speakEnglish(lastModalSpokenText);
            } 
            else if (phase === 'seller_gives_change') {
                roleTitle.textContent = selectedMode === '2p' ? "🏪 P2 (てんいん)：おつりをだそう！" : "🏪 おつりをだそう！";
                roleTitle.style.background = "#2A9D8F";
                lbl1.textContent = `もらったお金 (${formatGBP(buyerPaidPence)})`;
                val1.textContent = `おつり: ???`;
                lbl2.textContent = "わたすおつり";
                val2.textContent = "£0.00";
                confirmBtn.textContent = "💰 おつりをわたす";

                lastModalSpokenText = `Here is ${priceToEnglishSpeech(buyerPaidPence)}. Please give me my change!`;
                speakEnglish(lastModalSpokenText);
            }
        }

        function speakModalPrompt() {
            if (lastModalSpokenText) speakEnglish(lastModalSpokenText);
        }

        function addMoney(pence) {
            currentInputMoney += pence;
            document.getElementById('pay-val-2').textContent = formatGBP(currentInputMoney);
            speakEnglish(priceToEnglishSpeech(pence));
        }

        function resetPayment() {
            currentInputMoney = 0;
            document.getElementById('pay-val-2').textContent = '£0.00';
        }

        function confirmMoneyAction() {
            if (paymentPhase === 'buyer_pays') {
                if (currentInputMoney < targetBillPence) {
                    document.getElementById('payment-modal').style.display = 'none';
                    speakEnglish("Not enough money! No points!");
                    showToast("❌ お金が足りません！ポイントなし");
                    setTimeout(() => { roundNumber++; setupNextRound(); }, 2800);
                    return;
                }

                buyerPaidPence = currentInputMoney;
                expectedChangePence = buyerPaidPence - targetBillPence;

                if (selectedMode === '1p') {
                    score1 += 10;
                    updateScoreDisplay();
                    document.getElementById('payment-modal').style.display = 'none';
                    if (expectedChangePence === 0) {
                        speakEnglish("Exact change! Thank you!");
                        showToast("🎉 ぴったり！せいかい (+10pt)");
                    } else {
                        speakEnglish(`Thank you! Here is your change, ${priceToEnglishSpeech(expectedChangePence)}.`);
                        showToast(`🎉 おつり: ${formatGBP(expectedChangePence)} (+10pt)`);
                    }
                    setTimeout(() => { roundNumber++; setupNextRound(); }, 2800);
                } 
                else if (selectedMode === '2p') {
                    score1 += 5;
                    updateScoreDisplay();

                    if (expectedChangePence === 0) {
                        document.getElementById('payment-modal').style.display = 'none';
                        speakEnglish("Exact change! Great job!");
                        showToast("🎉 ぴったり！P1 (+5pt)");
                        setTimeout(() => { roundNumber++; setupNextRound(); }, 2800);
                    } else {
                        showToast("✅ P1 支払いOK (+5pt)！P2がおつりを出そう！");
                        openPaymentModal('seller_gives_change');
                    }
                }
            } 
            else if (paymentPhase === 'seller_gives_change') {
                document.getElementById('payment-modal').style.display = 'none';

                if (currentInputMoney === expectedChangePence) {
                    if (selectedMode === '1p') score1 += 5;
                    else score2 += 5;
                    updateScoreDisplay();
                    speakEnglish(`Perfect! ${priceToEnglishSpeech(expectedChangePence)} change. Thank you!`);
                    showToast(`🎉 おつりせいかい (${formatGBP(expectedChangePence)}) +5pt!`);
                } else {
                    speakEnglish("Wrong change! No points!");
                    showToast(`❌ おつりがちがいます！正解は ${formatGBP(expectedChangePence)}`);
                }

                setTimeout(() => { roundNumber++; setupNextRound(); }, 3000);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2800);
        }
    </script>
</body>
</html>
