name: Zapisz produkty z gry

on:
  workflow_dispatch:
    inputs:
      json_data:
        description: 'Nowa zawartość pliku JSON'
        required: true

permissions:
  contents: write

jobs:
  update-file:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Zapisz dane do pliku produkty.json
        run: |
          echo '${{ github.event.inputs.json_data }}' > produkty.json

      - name: Commit i Push zmian do repozytorium
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add produkty.json
          git commit -m "Automatyczna aktualizacja produktów z tabletu szkolnego" || exit 0
          git push
